---
# Dos hosts (docs/00-plan.md, Día 5). El controlador es la propia Dell (WSL): ahí corre el runner de CI (D8).
all:
  children:
    lab:
      hosts:
        lab-dell:
          ansible_connection: local
    hub:
      hosts:
        redes-lab-hub:
          # IP del droplet DENTRO de la VPN: el SSH del droplet no existe hacia internet (evidencia/dia4/ssh-solo-por-wg1.txt)
          ansible_host: 10.10.51.1
          ansible_user: deploy
          # Llave de despliegue exclusiva, sin frase (solo vale desde la Dell). scripts/desplegar.sh fija estas variables.
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'REDES_LAB_DEPLOY_KEY') | default('~/.ssh/id_ed25519_redes_deploy', true) }}"
          ansible_ssh_common_args: >-
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'REDES_LAB_KNOWN_HOSTS') | default('~/.ssh/known_hosts', true) }}
