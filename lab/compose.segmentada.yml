# Topología SEGMENTADA ("después"): docs/02-diseno.md §3.
# Un bridge de Docker por VLAN (nombres fijos, para que nftables los referencie), el
# segmento de IA sin salida (internal) y Caddy como única puerta hacia Ollama.
# La política entre segmentos la aplica lab/nftables/netseg.nft (cargada por scripts/lab.sh).
name: segmentada

x-nodo: &nodo
  image: lab-nodo:1
  build:
    context: ./imagen
  init: true
  restart: "no"
  volumes:
    - ./ca:/ca:ro        # certificado raíz (público) de la CA interna de Caddy

networks:
  trabajo:                       # VLAN 10
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-trabajo
      # La VPN (wg0) llega a Caddy por su IP real, sin NAT. Docker descarta por defecto lo que entra a la
      # IP de un contenedor por otra interfaz (capa raw): aquí se exceptúa wg0. Su cadena DOCKER también
      # lo descarta; esa excepción la pone scripts/wg0.sh en DOCKER-USER. netseg decide qué pasa de verdad.
      # (No sirve gateway_mode "routed": quita el NAT de salida y Trabajo perdería internet.)
      com.docker.network.bridge.trusted_host_interfaces: wg0:wg1   # separador: dos puntos (comprobado)
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
  ia:                            # VLAN 20 · sin salida a internet
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-ia
    ipam:
      config:
        - subnet: 10.10.20.0/24
  invitados:                     # VLAN 30
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-invitados
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1
  admin:                         # VLAN 99
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-admin
    ipam:
      config:
        - subnet: 10.10.99.0/24
          gateway: 10.10.99.1
  inet:                          # "Internet" emulado (RFC 5737); el host es 203.0.113.1
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-inet
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1

# Volúmenes externos con nombre global (los crea scripts/lab.sh; nunca usar `down -v`):
# el modelo se descargó en la topología plana y aquí solo se monta, sin necesitar internet;
# caddy-data guarda la CA interna (con su llave privada), que no sale de ese volumen.
volumes:
  ollama-data:
    name: ollama-data
    external: true
  caddy-data:
    name: caddy-data
    external: true
  hermes-data:
    name: hermes-data

services:
  # Única puerta de enlace de aplicación: pata en Trabajo, IA y Admin (no enruta entre ellas).
  # TLS con la CA interna de Caddy, sin ACME ni salida a internet. Un certificado por nombre:
  # ia.lab.internal y las IP de Caddy (el celular no resuelve nombres .internal ni envía SNI para una
  # IP, y Caddy entonces elige el certificado por la IP a la que llegó la conexión; por eso las VPN
  # llegan a 10.10.10.5 por su IP real y no a una dirección traducida, ver docs/02-diseno.md §3).
  # Imagen fijada por digest (caddy 2.11.7-alpine).
  caddy:
    image: caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    container_name: caddy
    restart: "no"
    environment:
      SITIOS: "ia.lab.internal, 10.10.10.5, 10.10.99.5"
      UPSTREAM: "10.10.20.10:11434"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      trabajo: { ipv4_address: 10.10.10.5, gw_priority: 10, aliases: [ia.lab.internal] }
      ia: { ipv4_address: 10.10.20.5 }
      admin: { ipv4_address: 10.10.99.5, aliases: [ia.lab.internal] }

  # Ollama real con GPU, solo en el segmento de IA (sin ruta a internet): el modelo ya está
  # en el volumen. Imagen fijada por digest (v0.40.10).
  ollama:
    image: ollama/ollama@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    container_name: ollama
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m               # cargar el modelo cuesta ~3.7 GB de commit de Windows: no dejarlo residente
      OLLAMA_NO_CLOUD: "1"
      LLAMA_ARG_CACHE_RAM: "1024"         # el caché de prompts de llama.cpp usa hasta 8 GB de RAM por defecto: la VM de WSL tiene 7.8 GB
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks:
      ia: { ipv4_address: 10.10.20.10 }

  proyecto1:
    <<: *nodo
    container_name: proyecto1
    environment: { NOMBRE: proyecto1, ESCUCHA: "8080" }
    networks:
      trabajo: { ipv4_address: 10.10.10.11 }

  proyecto2:
    <<: *nodo
    container_name: proyecto2
    environment: { NOMBRE: proyecto2, ESCUCHA: "8080" }
    networks:
      trabajo: { ipv4_address: 10.10.10.12 }

  proyecto3:
    <<: *nodo
    container_name: proyecto3
    environment: { NOMBRE: proyecto3, ESCUCHA: "8080" }
    networks:
      trabajo: { ipv4_address: 10.10.10.13 }

  proyecto4:
    <<: *nodo
    container_name: proyecto4
    environment: { NOMBRE: proyecto4, ESCUCHA: "8080" }
    networks:
      trabajo: { ipv4_address: 10.10.10.14 }

  proyecto5:
    <<: *nodo
    container_name: proyecto5
    environment: { NOMBRE: proyecto5, ESCUCHA: "8080" }
    networks:
      trabajo: { ipv4_address: 10.10.10.15 }

  # Hermes Agent real (v0.22.5, imagen fijada por digest), solo en Admin y sin puertos de entrada.
# No monta el socket de Docker ni nada del host; su configuración es de solo lectura y sale del
# repositorio. Se usa por `docker exec hermes hermes chat -q "..." -Q` (no hay pasarela de chat).
  hermes:
    image: nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    container_name: hermes
    restart: "no"
    command: ["sleep", "infinity"]
    environment:
      PUID: "1000"
      PGID: "1000"
      HERMES_SKIP_CONFIG_MIGRATION: "1"
      SSL_CERT_FILE: /ca/bundle.crt       # CA interna + CA públicas (GitHub, Día 6)
      REQUESTS_CA_BUNDLE: /ca/bundle.crt
    volumes:
      - hermes-data:/opt/data               # sesiones y memoria
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./ca:/ca:ro
      - ./snapshots:/snapshots:ro           # lo que Hermes puede LEER del estado (scripts/snapshot.sh); no escribe nada del host
    networks:
      admin: { ipv4_address: 10.10.99.20 }

  colector:
    <<: *nodo
    container_name: colector
    environment: { NOMBRE: colector, ESCUCHA: "9100" }
    networks:
      admin: { ipv4_address: 10.10.99.30 }

  iot-sensor:
    <<: *nodo
    container_name: iot-sensor
    environment: { NOMBRE: iot-sensor, ESCUCHA: "1883" }
    networks:
      invitados: { ipv4_address: 10.10.30.10 }

  invitado:
    <<: *nodo
    container_name: invitado
    environment: { NOMBRE: invitado, ESCUCHA: "8080" }
    networks:
      invitados: { ipv4_address: 10.10.30.11 }

  # Cliente WireGuard emulado (Día 4): su wg0 la crea scripts/wg0.sh con la configuración que genera
  # en lab/wireguard/ (no versionada). Con el túnel enruta 10.10.0.0/16 por wg0: lo que no debe
  # alcanzar lo corta netseg en el host, no la configuración del cliente.
  cliente-remoto:
    <<: *nodo
    container_name: cliente-remoto
    cap_add: [NET_ADMIN]
    environment: { NOMBRE: cliente-remoto }
    volumes:
      - ./ca:/ca:ro
      - ./wireguard/wg0-cliente.conf:/etc/wireguard/wg0.conf:ro
    networks:
      inet: { ipv4_address: 203.0.113.10 }
