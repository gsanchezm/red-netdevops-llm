# Topología PLANA ("antes"): equivale a la red actual de la casa (docs/01-red-actual.md).
# Un solo dominio de broadcast (10.10.0.0/24), todos los servicios alcanzables entre sí,
# Ollama sin TLS ni control, salida a internet para todos y ninguna regla nftables.
# Uso: scripts/lab.sh plana
name: plana

x-nodo: &nodo
  image: lab-nodo:1
  build:
    context: ./imagen
  init: true
  restart: "no"

networks:
  plana:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-plana
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

# Volúmenes con nombre global (sin prefijo del proyecto) y externos: los comparten las dos
# topologías y Compose nunca los borra. Los crea scripts/lab.sh. El modelo se descarga aquí
# (esta topología sí tiene salida) y la segmentada lo monta sin necesitar internet.
volumes:
  ollama-data:
    name: ollama-data
    external: true

services:
  # En la topología plana no hay proxy TLS: Caddy es solo un puerto abierto (nodo de prueba).
  caddy:
    <<: *nodo
    container_name: caddy
    environment: { NOMBRE: caddy, ESCUCHA: "443" }
    networks:
      plana: { ipv4_address: 10.10.0.5 }

  # Ollama real con GPU, publicado sin TLS ni control para toda la red (como hoy hacen los
  # equipos de la casa). Imagen fijada por digest (v0.40.10).
  ollama:
    image: ollama/ollama@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    container_name: ollama
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "65536"      # Hermes exige >= 64 K (D9); el modelo debe haberse entrenado con >= 64 K
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"       # un solo modelo en la GPU de 6 GB
      OLLAMA_KEEP_ALIVE: 5m               # cargar el modelo cuesta ~3.7 GB de commit de Windows y 3.2 GB de VRAM: no dejarlo residente
      OLLAMA_NO_CLOUD: "1"
      LLAMA_ARG_CACHE_RAM: "1024"         # el caché de prompts de llama.cpp usa hasta 8 GB de RAM por defecto: la VM de WSL tiene 7.8 GB
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks:
      plana: { ipv4_address: 10.10.0.10 }

  proyecto1:
    <<: *nodo
    container_name: proyecto1
    environment: { NOMBRE: proyecto1, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.11 }

  proyecto2:
    <<: *nodo
    container_name: proyecto2
    environment: { NOMBRE: proyecto2, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.12 }

  proyecto3:
    <<: *nodo
    container_name: proyecto3
    environment: { NOMBRE: proyecto3, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.13 }

  proyecto4:
    <<: *nodo
    container_name: proyecto4
    environment: { NOMBRE: proyecto4, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.14 }

  proyecto5:
    <<: *nodo
    container_name: proyecto5
    environment: { NOMBRE: proyecto5, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.15 }

  hermes:
    <<: *nodo
    container_name: hermes
    environment: { NOMBRE: hermes }
    networks:
      plana: { ipv4_address: 10.10.0.20 }

  colector:
    <<: *nodo
    container_name: colector
    environment: { NOMBRE: colector, ESCUCHA: "9100" }
    networks:
      plana: { ipv4_address: 10.10.0.30 }

  # En la topología plana las IP de IoT/invitado no pueden ser .10/.11 (ya son de
  # Ollama y proyecto1); se numeran .40/.41.
  iot-sensor:
    <<: *nodo
    container_name: iot-sensor
    environment: { NOMBRE: iot-sensor, ESCUCHA: "1883" }
    networks:
      plana: { ipv4_address: 10.10.0.40 }

  invitado:
    <<: *nodo
    container_name: invitado
    environment: { NOMBRE: invitado, ESCUCHA: "8080" }
    networks:
      plana: { ipv4_address: 10.10.0.41 }
