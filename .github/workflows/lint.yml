---
# CI: valida todo lo versionado en una máquina de GitHub (no necesita acceso al laboratorio ni al droplet).
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Linters y comprobaciones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # La imagen de GitHub trae su propio Ansible (2.21): mezclarlo con el de apt rompe el entorno. Se instalan en un
      # entorno virtual y con las versiones fijadas, las mismas con las que se desarrolla en la Dell.
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends yamllint shellcheck nftables python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ansible-core==2.16.3 ansible-lint==6.17.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Versiones
        run: |
          ansible --version | head -1
          ansible-lint --version | head -1

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint ansible/

      - name: Sintaxis de los playbooks
        run: cd ansible && ansible-playbook site.yml --syntax-check -e @vars.example.yml

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh scripts/wsl/*.sh droplet/*.sh

      - name: Reglas nftables válidas (laboratorio y droplet)
        run: |
          sudo nft -c -f lab/nftables/netseg.nft
          sudo nft -c -f droplet/hub.nft

      - name: Compose válido
        run: |
          docker compose -f lab/compose.plana.yml config -q
          docker compose -f lab/compose.segmentada.yml config -q

      - name: Sin IP reales ni llaves en el repositorio
        run: |
          scripts/escanear-secretos.sh --probar
          scripts/escanear-secretos.sh
